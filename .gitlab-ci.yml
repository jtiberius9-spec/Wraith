# Wraith CI — builds the Windows installer and publishes GitLab Releases.
#
# How to ship a release:
#   1. Bump __version__ (wraith/__init__.py) + Wraith-mac.spec, merge to main.
#   2. Push a tag like v0.4.0.
#   3. CI builds Wraith-Setup-v0.4.0.exe, uploads it to the package registry,
#      and creates a GitLab Release with the .exe attached — which the in-app
#      updater (wraith/updater.py, target gitlab:the-thinker2/Wraith) picks up.
#
# Need a test build without tagging? Run a pipeline manually (Build > Pipelines
# > New pipeline) and start the build:windows job — grab the artifact.

stages: [build, release]

variables:
  # must match BUNDLED_SCRCPY_VERSION in wraith/runtime.py (server jar handshake)
  SCRCPY_VERSION: "4.0"
  PKG_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/wraith/${CI_COMMIT_TAG}"

build:windows:
  stage: build
  tags: [saas-windows-medium-amd64]      # GitLab.com shared Windows runner
  timeout: 1h
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"   # manual test builds from the UI
      when: manual
  script:
    # toolchain — chocolatey is preinstalled on the SaaS Windows image
    - choco install -y --no-progress python311 innosetup
    - Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"; refreshenv
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install pyinstaller -r requirements.txt
    # stage bin\ — the spec bundles it: adb + scrcpy-server (from the scrcpy
    # zip, which keeps them version-matched) and ffmpeg.exe (F12 recording mux)
    - New-Item -ItemType Directory -Force bin | Out-Null
    - Invoke-WebRequest "https://github.com/Genymobile/scrcpy/releases/download/v$env:SCRCPY_VERSION/scrcpy-win64-v$env:SCRCPY_VERSION.zip" -OutFile scrcpy.zip
    - Expand-Archive scrcpy.zip -DestinationPath scrcpy_tmp
    - Get-ChildItem scrcpy_tmp -Recurse -Filter scrcpy-server | Select-Object -First 1 | Copy-Item -Destination bin\scrcpy-server
    - Get-ChildItem scrcpy_tmp -Recurse -Include adb.exe, AdbWinApi.dll, AdbWinUsbApi.dll | Copy-Item -Destination bin\
    - Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
    - Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
    - Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | Copy-Item -Destination bin\ffmpeg.exe
    # app -> installer (version = the tag when present, else the .iss default)
    - python -m PyInstaller Wraith.spec --noconfirm
    - $ver = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { "dev-$env:CI_COMMIT_SHORT_SHA" }
    - '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" Wraith.iss'
    # tags: push the .exe to the generic package registry (permanent direct URL
    # — job artifacts expire, package files don't) for the release job to link
    - |
      if ($env:CI_COMMIT_TAG) {
        $exe = Get-ChildItem installer -Filter *.exe | Select-Object -First 1
        Invoke-WebRequest -Method Put -Headers @{ "JOB-TOKEN" = $env:CI_JOB_TOKEN } -InFile $exe.FullName -Uri "$env:PKG_URL/$($exe.Name)"
      }
  artifacts:
    paths: [installer/]
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs: ["build:windows"]
  script:
    - echo "Releasing Wraith $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Wraith $CI_COMMIT_TAG"
    description: "Wraith $CI_COMMIT_TAG — see the commit history for changes."
    assets:
      links:
        # name must end in .exe — the in-app updater picks the first such link
        - name: "Wraith-Setup-$CI_COMMIT_TAG.exe"
          url: "${PKG_URL}/Wraith-Setup-$CI_COMMIT_TAG.exe"
          link_type: package
